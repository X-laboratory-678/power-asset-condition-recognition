[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-asset-condition-recognition"
version = "0.1.0"
description = "Code for Response–Representation Coupled Shaping and Native Visual Reference Fusion in power-asset condition recognition"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "Pillow==11.3.0",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers==4.57.1",
  "peft==0.17.1",
  "bitsandbytes==0.48.2",
  "accelerate==1.11.0",
  "ultralytics==8.3.0",
]

[project.scripts]
pacr = "power_asset_condition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
